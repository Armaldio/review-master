name: Release to npm

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

concurrency:
  group: mergepeek-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  changeset-check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Require release note for package changes
        if: github.event_name == 'push' || !startsWith(github.head_ref, 'changeset-release/')
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node scripts/require-changeset.mjs "$BASE_SHA" "$HEAD_SHA"

  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: changeset-check
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install npm with trusted publishing support
        run: npm install --global npm@11.15.0
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: Verify the packed package
        run: |
          mkdir -p release
          npm pack --json --pack-destination release > release/pack.json
          node scripts/verify-package.mjs "release/$(node -p "JSON.parse(require('fs').readFileSync('release/pack.json', 'utf8'))[0].filename")"
      - name: Create a version PR or publish the release
        uses: changesets/action@v2
        with:
          publish-script: npm run release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_CONFIG_PROVENANCE: "true"

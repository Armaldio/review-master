name: Publish to npm

on:
  push:
    branches: [main]

concurrency:
  group: npm-publish-${{ github.repository }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install npm with trusted publishing support
        run: npm install --global npm@11.15.0
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: Pack and verify the release artifact
        run: |
          mkdir -p release
          npm pack --json --pack-destination release > release/pack.json
          node scripts/verify-package.mjs "release/$(node -p "JSON.parse(require('fs').readFileSync('release/pack.json', 'utf8'))[0].filename")"
      - uses: actions/upload-artifact@v4
        with:
          name: npm-package
          path: release/*.tgz
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install npm with trusted publishing support
        run: npm install --global npm@11.15.0
      - uses: actions/download-artifact@v4
        with:
          name: npm-package
          path: release
      - name: Skip only if this exact version is already published
        id: registry
        run: |
          node --input-type=module <<'NODE'
          import { appendFileSync, readFileSync } from 'node:fs';

          const { name, version } = JSON.parse(readFileSync('package.json', 'utf8'));
          const encodedName = encodeURIComponent(name).replace('%40', '@').replace('%2F', '%2f');
          const response = await fetch(`https://registry.npmjs.org/${encodedName}/${encodeURIComponent(version)}`);
          if (response.status === 404) {
            console.log(`${name}@${version} is not published yet`);
            appendFileSync(process.env.GITHUB_OUTPUT, 'already-published=false\n');
          } else if (!response.ok) {
            throw new Error(`npm registry lookup failed (${response.status} ${response.statusText})`);
          } else {
            const published = await response.json();
            if (published.name !== name || published.version !== version) {
              throw new Error(`Registry returned unexpected package ${published.name}@${published.version}`);
            }
            console.log(`${name}@${version} is already published; skipping`);
            appendFileSync(process.env.GITHUB_OUTPUT, 'already-published=true\n');
          }
          NODE
      - name: Publish with npm trusted publishing
        if: steps.registry.outputs.already-published != 'true'
        run: npm publish release/*.tgz --provenance --access public
